# このサンプル専用の最小 pyproject.toml。
#
# - このサンプルは 3rd party の `requests` に依存しているので、
#   リポジトリ全体の方針（標準ライブラリのみ）からは外して
#   このディレクトリだけで完結させている。
# - uv で動かすことを想定:
#       cd samples/18_http_request_with_requests
#       uv sync          # .venv をこの dir に作って requests を入れる
#       uv run main.py   # その .venv の Python で main.py を実行
# - scripts/run_all.py からは EXCLUDED として除外している。

[project]
name = "http-request-with-requests"
version = "0.0.0"
description = "Sample: HTTP request with the third-party `requests` library."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]
